# Pipeline unico do projeto: politica, inventario, vulnerabilidades e assinatura.
# Todas as evidencias e o Summary sao gerados no GitHub Actions.
name: Supply chain

# Publica somente a partir da main; a execucao manual tambem exige essa branch.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Leitura por padrao. Escrita no GHCR e OIDC sao concedidos apenas ao job abaixo.
permissions:
  contents: read

# Evita publicacoes concorrentes do mesmo workflow e referencia.
concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-sign-verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:

      # 01 - Obtem os arquivos do commit analisado, sem persistir credenciais Git.
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 02 - Compartilha a pasta temporaria do banco entre scans desta execucao.
      # cache:false nas Actions nao preserva o banco entre execucoes.
      - name: Configurar cache do Trivy no runner
        id: cache
        run: |
          mkdir -p "$RUNNER_TEMP/command-logs"
          exec > >(tee -a "$RUNNER_TEMP/command-logs/01-cache.log") 2>&1
          set -x
          printf 'TRIVY_CACHE_DIR=%s/trivy-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      # 03 - Prepara o motor das politicas Rego com Action por SHA e versao fixa.
      - name: Instalar OPA para politicas Rego
        id: setup_opa
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: '1.22.1'
          static: true

      # 04 - Prepara assinatura keyless e verificacao de integridade e identidade.
      - name: Instalar Cosign
        id: setup_cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      # 05 - Passo 1 do enunciado: testa Rego, constroi as imagens e confere o UID.
      # Root deve ser rejeitado e UID 10001 aceito: ambas sao assercoes de sucesso.
      - name: Politicas e demonstracao antes/depois
        id: policy
        run: |
          mkdir -p "$RUNNER_TEMP/command-logs"
          exec > >(tee -a "$RUNNER_TEMP/command-logs/02-policy.log") 2>&1
          set -x
          set -euo pipefail
          mkdir -p artifacts
          opa test policies/ -v 2>&1 | tee artifacts/opa-tests.txt
          opa test policies/ --coverage --format=json > artifacts/opa-coverage.json
          # Antes: base historica. Depois e variante: a mesma base atualizada.
          base_before=$(cat config/base-image.txt)
          base_after=$(cat config/base-image-after.txt)
          [[ "$base_before" =~ @sha256:[a-f0-9]{64}$ ]]
          [[ "$base_after" =~ @sha256:[a-f0-9]{64}$ ]]
          [[ "$base_before" != "$base_after" ]]
          [[ $(sed -n 's/^FROM //p' scenarios/Dockerfile.before) == "$base_before" ]]
          for file in Dockerfile scenarios/Dockerfile.tampered; do
            [[ $(sed -n 's/^FROM //p' "$file") == "$base_after" ]]
          done
          for variant in before after; do
            dockerfile=Dockerfile
            [[ "$variant" != before ]] || dockerfile=scenarios/Dockerfile.before
            docker build --pull --file "$dockerfile" --tag "lab:$variant" . 2>&1 | tee "artifacts/build-$variant.txt"
            docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges "lab:$variant" | tee "artifacts/run-$variant.txt"
            uid=$(docker run --rm --network none --entrypoint /usr/bin/id "lab:$variant" -u)
            if [[ "$variant" == before ]]; then
              [[ "$uid" == 0 ]]
            else
              [[ "$uid" == 10001 ]]
            fi
            docker image inspect "lab:$variant" | jq -e 'if length == 1 then .[0] | {image_id: .Id, repo_digests: .RepoDigests, config: {User: .Config.User}} else error("inspect invalido") end' > "artifacts/image-$variant.json"
            opa eval --format=json --data policies/image_user.rego --input "artifacts/image-$variant.json" 'data.supply.image.deny' > "artifacts/policy-$variant.json"
            if [[ "$variant" == before ]]; then
              jq -e '.result[0].expressions[0].value | type == "array" and length == 1 and .[0] == "Defina USER com UID numerico maior que zero (grupo numerico opcional)."' "artifacts/policy-$variant.json"
            else
              jq -e '.result[0].expressions[0].value | type == "array" and length == 0' "artifacts/policy-$variant.json"
            fi
          done

      # 06 - Passo 2: inventario CycloneDX dos pacotes da imagem inicial.
      - name: Syft - SBOM da imagem before
        id: sbom_before
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: docker:lab:before
          syft-version: v1.57.0
          format: cyclonedx-json
          output-file: artifacts/sbom-before.cdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      # 07 - Inventario da imagem com UID corrigido e base atualizada.
      - name: Syft - SBOM da imagem after
        id: sbom_after
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: docker:lab:after
          syft-version: v1.57.0
          format: cyclonedx-json
          output-file: artifacts/sbom-after.cdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      # 08 - Analisa CVEs da imagem inicial. Achados sao intencionais no laboratorio.
      # exit-code:0 permite guardar o relatorio; uma assercao posterior exige um achado real.
      - name: Trivy - imagem before
        id: trivy_before
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: image
          image-ref: lab:before
          scanners: vuln
          timeout: 15m
          exit-code: '0'
          format: json
          output: artifacts/trivy-before.json
          cache-dir: ${{ runner.temp }}/trivy-cache
          cache: false
          skip-setup-trivy: false
        env:
          TRIVY_IMAGE_SRC: docker

      # 09 - Analisa a imagem final e reaproveita a instalacao do Trivy.
      - name: Trivy - imagem after
        id: trivy_after
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: image
          image-ref: lab:after
          scanners: vuln
          timeout: 15m
          exit-code: '0'
          format: json
          output: artifacts/trivy-after.json
          cache-dir: ${{ runner.temp }}/trivy-cache
          cache: false
          skip-setup-trivy: true
        env:
          TRIVY_IMAGE_SRC: docker

      # 10 - Valida SBOMs, exige um achado real e gera ficha, tabela e print.
      # A captura usa o relatorio real no runner; nao simula resultados.
      - name: Validar inventarios e preparar evidencias do Trivy
        id: reports
        run: |
          mkdir -p "$RUNNER_TEMP/command-logs"
          exec > >(tee -a "$RUNNER_TEMP/command-logs/03-reports.log") 2>&1
          set -x
          set -euo pipefail
          for variant in before after; do
            jq -e '.bomFormat == "CycloneDX" and (.components | length > 0)' "artifacts/sbom-$variant.cdx.json"
            trivy convert --format table --output "artifacts/trivy-$variant.txt" "artifacts/trivy-$variant.json"
            cat "artifacts/trivy-$variant.txt"
          done
          jq -e '[.Results[]? | .Vulnerabilities[]?] | length > 0' artifacts/trivy-before.json
          python3 - <<'PY_FINDINGS'
          import datetime
          import html
          import json
          from pathlib import Path
          import os

          if os.environ.get("GITHUB_ACTIONS") != "true":
              raise SystemExit("Execute pelo GitHub Actions.")

          root = Path("artifacts")
          report = json.loads((root / "trivy-before.json").read_text())
          findings = [v for result in report.get("Results", []) for v in result.get("Vulnerabilities", [])]
          if not findings:
              raise SystemExit("A imagem inicial nao apresentou vulnerabilidade real.")
          rank = {"CRITICAL": 0, "HIGH": 1, "MEDIUM": 2, "LOW": 3, "UNKNOWN": 4}
          finding = sorted(findings, key=lambda v: (rank.get(v.get("Severity"), 5), v["VulnerabilityID"]))[0]
          selection = {
              "analyzed_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "base_image": Path("config/base-image.txt").read_text().strip(),
              "image": json.loads((root / "image-before.json").read_text()),
              "image_metadata": report.get("Metadata"),
              "finding": finding,
          }
          (root / "selected-finding.json").write_text(json.dumps(selection, indent=2) + "\n")
          lines = ["# Vulnerabilidade observada", "", f"- Identificador: {finding['VulnerabilityID']}",
                   f"- Pacote: {finding['PkgName']}", f"- Versao instalada: {finding['InstalledVersion']}",
                   f"- Severidade: {finding['Severity']}", f"- Versao corrigida: {finding.get('FixedVersion') or 'nao informada'}",
                   f"- Advisory: {finding.get('PrimaryURL') or 'consultar References no JSON'}", "",
                   "O digest da base, ID da imagem construida no runner e os metadados do scanner estao em selected-finding.json.",
                   "A imagem final altera o usuario e atualiza a base; consultar trivy-comparison.json para os achados de cada scan."]
          (root / "vulnerability.md").write_text("\n".join(lines) + "\n")
          # Compara os scans reais por alvo, tipo, pacote e identificador.
          after_report = json.loads((root / "trivy-after.json").read_text())
          def indexed_findings(scan):
              return {
                  (result.get("Class", ""), result.get("Type", ""), v.get("PkgName", ""), v["VulnerabilityID"]): v
                  for result in (scan.get("Results") or [])
                  for v in (result.get("Vulnerabilities") or [])
              }
          before_index = indexed_findings(report)
          after_index = indexed_findings(after_report)
          groups = {
              "not_detected_after": sorted(before_index.keys() - after_index.keys()),
              "persistent": sorted(before_index.keys() & after_index.keys()),
              "newly_detected_after": sorted(after_index.keys() - before_index.keys()),
          }
          comparison = {
              "base_before": Path("config/base-image.txt").read_text().strip(),
              "base_after": Path("config/base-image-after.txt").read_text().strip(),
              "counts": {name: len(keys) for name, keys in groups.items()},
              "findings": {name: [dict(zip(["class", "type", "package", "id"], key)) for key in keys] for name, keys in groups.items()},
              "note": "Nao detectado depois nao prova correcao individual: pacotes podem ter sido atualizados ou removidos, e a cobertura do scanner varia entre bases.",
          }
          (root / "trivy-comparison.json").write_text(json.dumps(comparison, indent=2) + "\n")
          # Visualizacao do relatorio real para leitura no navegador; nao e um print fabricado.
          table = (root / "trivy-before.txt").read_text()
          (root / "trivy-report.html").write_text('<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Trivy — imagem inicial</title><h1>Resultado real do Trivy</h1><pre>' + html.escape('\n'.join(lines) + '\n\n' + table) + '</pre></html>')
          PY_FINDINGS
          # Captura do relatorio real; o Chrome integra a imagem do runner hospedado.
          google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --screenshot="$PWD/artifacts/trivy-before.png" --window-size=1600,1200 \
            "file://$PWD/artifacts/trivy-report.html" > artifacts/screenshot.log 2>&1
          [[ -s artifacts/trivy-before.png ]]

      # 11 - Autentica com GITHUB_TOKEN para publicar as imagens do laboratorio.
      # Nunca habilitar set -x ao expandir o token neste step.
      - name: Login no GHCR
        id: registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/command-logs"
          exec > >(tee -a "$RUNNER_TEMP/command-logs/04-registry.log") 2>&1
          printf '%s\n' 'Comando: docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin (token omitido)'
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # 12 - Publica a imagem ja testada, obtem o digest e reaplica o gate Rego.
      # Nao reconstruir entre a validacao e a assinatura.
      - name: Publicar imagem validada
        id: publish
        run: |
          mkdir -p "$RUNNER_TEMP/command-logs"
          exec > >(tee -a "$RUNNER_TEMP/command-logs/05-publish.log") 2>&1
          set -x
          set -euo pipefail
          [[ ${GITHUB_ACTIONS:-} == true && ${GITHUB_REF:-} == refs/heads/main ]]
          repository=${GITHUB_REPOSITORY,,}
          image="ghcr.io/$repository"
          tag="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          # Push das imagens ja validadas, sem reconstruir entre o gate e a assinatura.
          docker tag lab:after "$image:$tag"
          docker push "$image:$tag" 2>&1 | tee artifacts/push-after.txt
          docker pull "$image:$tag" > artifacts/pull-after.txt 2>&1
          ref=$(docker image inspect "$image:$tag" | jq -er --arg prefix "$image@sha256:" '.[0].RepoDigests[] | select(startswith($prefix))')
          [[ "$ref" =~ @sha256:[a-f0-9]{64}$ ]]
          printf '%s\n' "$ref" > artifacts/signed-image.txt
          docker image inspect "$ref" | jq -e 'if length == 1 then .[0] | {image_id: .Id, repo_digests: .RepoDigests, config: {User: .Config.User}} else error("inspect invalido") end' > artifacts/published-image.json
          opa eval --format=json --data policies/image_user.rego --input artifacts/published-image.json 'data.supply.image.deny' > artifacts/policy-published.json
          jq -e '.result[0].expressions[0].value | type == "array" and length == 0' artifacts/policy-published.json
          printf 'image=%s\n' "$ref" >> "$GITHUB_OUTPUT"

      # 13 - Gera o inventario da referencia exata que sera assinada.
      - name: Syft - SBOM da imagem publicada por digest
        id: sbom_published
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: registry:${{ steps.publish.outputs.image }}
          syft-version: v1.57.0
          format: cyclonedx-json
          output-file: artifacts/sbom-published.cdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      # 14 - Passo 3: assina por OIDC e exige issuer e identidade exatos.
      # A variante recebe um marcador, outro digest e nenhuma assinatura.
      # Sua rejeicao so conta se a imagem existir e o motivo for ausencia de assinatura confiavel.
      - name: Assinar, verificar e rejeitar adulteracao
        id: sign_verify
        env:
          PUBLISHED_IMAGE: ${{ steps.publish.outputs.image }}
        run: |
          mkdir -p "$RUNNER_TEMP/command-logs"
          exec > >(tee -a "$RUNNER_TEMP/command-logs/06-sign-verify.log") 2>&1
          set -x
          set -euo pipefail
          ref="$PUBLISHED_IMAGE"
          [[ "$ref" =~ @sha256:[a-f0-9]{64}$ ]]
          repository=${GITHUB_REPOSITORY,,}
          tampered_image="ghcr.io/$repository-tampered"
          tag="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          identity="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/supply-chain.yml@refs/heads/main"
          jq -e '.bomFormat == "CycloneDX" and (.components | length > 0)' artifacts/sbom-published.cdx.json
          cosign sign --yes "$ref" > artifacts/cosign-sign.txt 2>&1
          verify() {
            cosign verify --certificate-identity "$identity" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$ref"
          }
          verify > artifacts/cosign-verify.json 2> artifacts/cosign-verify.stderr
          jq -e 'length > 0' artifacts/cosign-verify.json
          # Atestacao assinada associa o SBOM ao digest publicado.
          cosign attest --yes --type cyclonedx --predicate artifacts/sbom-published.cdx.json "$ref" > artifacts/cosign-attest.txt 2>&1
          cosign verify-attestation --type cyclonedx --certificate-identity "$identity" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$ref" > artifacts/cosign-sbom.json 2> artifacts/cosign-sbom.stderr
          # Apenas alteracao inofensiva de laboratorio. Nao assinar esta imagem.
          docker build --file scenarios/Dockerfile.tampered --tag "$tampered_image:$tag" . 2>&1 | tee artifacts/build-tampered.txt
          docker push "$tampered_image:$tag" 2>&1 | tee artifacts/push-tampered.txt
          docker pull "$tampered_image:$tag" > artifacts/pull-tampered.txt 2>&1
          tampered_ref=$(docker image inspect "$tampered_image:$tag" | jq -er --arg prefix "$tampered_image@sha256:" '.[0].RepoDigests[] | select(startswith($prefix))')
          [[ "$tampered_ref" =~ @sha256:[a-f0-9]{64}$ ]]
          [[ "${ref##*@}" != "${tampered_ref##*@}" ]]
          printf '%s\n' "$tampered_ref" > artifacts/tampered-image.txt
          [[ "$tampered_ref" =~ @sha256:[a-f0-9]{64}$ ]]
          # Uma imagem inexistente ou inacessivel nao comprova rejeicao de assinatura.
          docker pull "$tampered_ref" > artifacts/tampered-pull.txt 2>&1
          docker buildx imagetools inspect "$tampered_ref" > artifacts/tampered-registry.txt 2>&1
          set +e
          cosign verify --certificate-identity "$identity" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$tampered_ref" > artifacts/cosign-tampered.json 2> artifacts/cosign-tampered.stderr
          status=$?
          set -e
          printf '%s\n' "$status" > artifacts/cosign-tampered.exit-code
          [[ "$status" -ne 0 ]] || { echo 'A imagem adulterada foi aceita indevidamente.' >&2; exit 1; }
          # Diagnosticos do Cosign fixado em tools.lock.json (formatos legado e OCI 1.1).
          grep -Eq 'no signatures found|no valid bundles exist in registry' artifacts/cosign-tampered.stderr
          if grep -Eiq 'unauthorized|denied|timeout|connection refused|no such host|TLS handshake|unexpected status|429|500 Internal|502 Bad|503 Service' artifacts/cosign-tampered.stderr; then
            echo 'Falha de infraestrutura nao conta como rejeicao de assinatura.' >&2
            exit 1
          fi
          printf 'PASS: imagem acessivel rejeitada por ausencia de assinatura confiavel.\n' | tee artifacts/tampered-assertion.txt
          # Controle positivo apos o teste negativo: o servico de verificacao segue operacional.
          verify > artifacts/cosign-verify-after-attack.json 2> artifacts/cosign-verify-after-attack.stderr
          jq -e 'length > 0' artifacts/cosign-verify-after-attack.json
          printf '%s\n' "$identity" > artifacts/trusted-identity.txt

      # 15 - Passo 4: preserva logs, versoes e checksums, mesmo apos falha.
      # O manifesto fotografa o estado na coleta, antes do upload.
      - name: Registrar evidencias e resumo
        id: collect
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p "$RUNNER_TEMP/command-logs"
          exec > >(tee -a "$RUNNER_TEMP/command-logs/07-collect.log") 2>&1
          set -x
          set -euo pipefail
          mkdir -p artifacts
          cp config/tools.lock.json config/actions.lock.json config/base-image*.txt artifacts/
          # Mesmo uma instalacao interrompida deve deixar um manifesto de execucao.
          collect_manifest() {
            set +x
            mkdir -p artifacts/command-logs
            cp "$RUNNER_TEMP/command-logs/"*.log artifacts/command-logs/
            python3 - <<'PY_MANIFEST'
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path

          if os.environ.get("GITHUB_ACTIONS") != "true":
              raise SystemExit("Execute pelo GitHub Actions.")

          root = Path("artifacts")
          manifest = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "analyzed_commit": os.environ["GITHUB_SHA"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "generated_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "job_status": os.environ.get("JOB_STATUS", "unknown"),
              "files": {},
          }
          for file in sorted(root.rglob("*")):
              if file.is_file() and file.name != "manifest.json":
                  manifest["files"][str(file.relative_to(root))] = hashlib.sha256(file.read_bytes()).hexdigest()
          (root / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY_MANIFEST
          }
          trap collect_manifest EXIT
          {
            for tool in opa syft trivy cosign docker; do
              if command -v "$tool" > /dev/null; then
                if [[ "$tool" == trivy ]]; then "$tool" --version; else "$tool" version; fi
              else
                printf '%s: indisponivel nesta execucao\n' "$tool"
              fi
            done
          } > artifacts/tool-versions.txt 2>&1

      # 16 - Publica os arquivos coletados para download; solicita retencao de 90 dias.
      - name: Preservar artifacts
        id: evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supply-chain-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

      # 17 - Organiza os resultados por etapa com comandos e saidas.
      # Verde indica assercao concluida; vermelho indica falha ou vulnerabilidade.
      # Um CVE vermelho e um achado; nao implica falha do laboratorio.
      - name: Publicar Job Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          STEPS_JSON: ${{ toJSON(steps) }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          WORKFLOW_FILE: .github/workflows/supply-chain.yml
        shell: python
        run: |
          """Organiza resultados existentes no Job Summary; nunca executa testes."""
          import html
          import json
          import os
          from collections import Counter
          from pathlib import Path
          from urllib.parse import urlsplit

          if os.environ.get("GITHUB_ACTIONS") != "true":
              raise SystemExit("Execute pelo GitHub Actions.")

          root = Path("artifacts")
          steps = json.loads(os.environ.get("STEPS_JSON", "{}"))
          notes = []


          def cell(value):
              text = html.escape(str(value)).replace("\n", " ")
              for char, entity in [("|", "&#124;"), ("`", "&#96;"), ("[", "&#91;"), ("]", "&#93;")]:
                  text = text.replace(char, entity)
              return text


          def read_json(name):
              path = root / name
              if not path.exists():
                  return None
              try:
                  return json.loads(path.read_text())
              except (ValueError, OSError):
                  notes.append(f"{name}: relatório indisponível ou incompleto.")
                  return None


          def read_text(name):
              path = root / name
              return path.read_text(errors="replace").strip() if path.exists() else "Não produzido"


          def outcome(step):
              return steps.get(step, {}).get("outcome", "skipped")


          labels = {"success": "🟢 OK", "failure": "🔴 Falhou", "cancelled": "🟠 Cancelado", "skipped": "⚪ Não executado"}
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          status = os.environ.get("JOB_STATUS", "unknown")
          lines = [f"# Raio-X da Cadeia de Suprimentos — {cell(os.environ['GITHUB_WORKFLOW'])}", "",
                   f"**Resultado dos steps anteriores:** {labels.get(status, cell(status))}", "",
                   f"[Execução e logs]({run_url}) · Tentativa {cell(os.environ['GITHUB_RUN_ATTEMPT'])}", "",
                   f"**Commit analisado:** `{cell(os.environ['GITHUB_SHA'])}`", "",
                   "## Controles e etapas", "", "| Etapa | Resultado |", "|---|---|"]
          controls = [("checkout", "Checkout"), ("cache", "Pasta temporária do Trivy"), ("setup_opa", "Instalação OPA / Rego"), ("setup_cosign", "Instalação Cosign"),
                      ("policy", "Testes Rego, builds, UID e gates antes/depois"), ("sbom_before", "Syft: SBOM antes"),
                      ("sbom_after", "Syft: SBOM depois"), ("trivy_before", "Trivy: scan antes"), ("trivy_after", "Trivy: scan depois"),
                      ("reports", "Validação dos inventários, achado real e print")]
          controls += [("registry", "Acesso ao GHCR"), ("publish", "Publicação e gate da imagem por digest"),
                       ("sbom_published", "Syft: SBOM da imagem publicada"), ("sign_verify", "Assinatura, atestação e rejeição de adulteração")]
          controls += [("collect", "Coleta e manifesto de evidências"), ("evidence", "Upload dos artifacts")]
          for step, title in controls:
              lines.append(f"| {title} | {labels.get(outcome(step), cell(outcome(step)))} |")
          lines += ["", "🟢 OK · 🔴 Falha · 🟠 Cancelado · ⚪ Não executado. Rejeições esperadas são sucesso dos testes; CVEs em vermelho são achados e não falha automática do pipeline.", "",
                    "## Antes e depois", "", "| Indicador | Antes | Depois |", "|---|---|---|"]
          before_base = read_text("base-image.txt")
          after_base = read_text("base-image-after.txt")
          lines.append(f"| Base da imagem | {cell(before_base)} | {cell(after_base)} |")
          images = [read_json(f"image-{v}.json") for v in ("before", "after")]
          users = [cell(image.get("config", {}).get("User", "Não informado")) if isinstance(image, dict) else "Não produzido" for image in images]
          lines.append(f"| USER da imagem | {users[0]} | {users[1]} |")
          policies = []
          for variant in ("before", "after"):
              data = read_json(f"policy-{variant}.json")
              try:
                  violations = data["result"][0]["expressions"][0]["value"]
                  policies.append(f"{'🔴' if violations else '🟢'} {len(violations)} violação(ões) observada(s)")
              except (TypeError, KeyError, IndexError):
                  policies.append("⚪ Não produzido / incompleto")
          lines.append(f"| Rego | {policies[0]} | {policies[1]} |")
          components = []
          for variant in ("before", "after"):
              data = read_json(f"sbom-{variant}.cdx.json")
              components.append(str(len(data.get("components") or [])) if isinstance(data, dict) else "Não produzido")
          lines.append(f"| Componentes no SBOM | {components[0]} | {components[1]} |")
          lines += ["", "A aprovação dos gates é indicada pelo status da etapa; dados parciais não comprovam aprovação.", "",
                    "## Vulnerabilidades — Trivy", "", "| Severidade | Antes | Depois |", "|---|---|---|"]
          counts = []
          for variant in ("before", "after"):
              data = read_json(f"trivy-{variant}.json")
              counts.append(Counter(v.get("Severity", "UNKNOWN") for result in (data.get("Results") or []) for v in (result.get("Vulnerabilities") or [])) if isinstance(data, dict) else None)
          for severity in ("CRITICAL", "HIGH", "MEDIUM", "LOW", "UNKNOWN"):
              values = [f"{'🔴' if c[severity] else '🟢'} {c[severity]}" if c is not None else "⚪ Não produzido" for c in counts]
              lines.append(f"| {severity} | {values[0]} | {values[1]} |")
          values = [f"{'🔴' if sum(c.values()) else '🟢'} {sum(c.values())}" if c is not None else "⚪ Não produzido" for c in counts]
          lines += [f"| **Total de ocorrências** | **{values[0]}** | **{values[1]}** |", "",
                    "As contagens representam ocorrências por pacote e alvo. O depois atualiza a base e remove root; a atualização de pacotes é o que pode reduzir CVEs, não a troca do usuário."]
          comparison = read_json("trivy-comparison.json")
          if isinstance(comparison, dict):
              delta = comparison["counts"]
              lines += ["", "### Efeito da atualização da base", "",
                        "| Comparação dos achados por pacote e identificador | Quantidade |", "|---|---|",
                        f"| 🟢 Não detectados no depois | {delta['not_detected_after']} |",
                        f"| {'🔴' if delta['persistent'] else '🟢'} Persistentes | {delta['persistent']} |",
                        f"| {'🔴' if delta['newly_detected_after'] else '🟢'} Detectados somente no depois | {delta['newly_detected_after']} |", "",
                        "Não detectado depois não prova correção individual. Consulte os pacotes e versões nos SBOMs e o detalhamento em trivy-comparison.json."]
          selected = read_json("selected-finding.json")
          if isinstance(selected, dict) and isinstance(selected.get("finding"), dict):
              finding = selected["finding"]
              lines += ["", "### Achado real selecionado", "", "| Campo | Valor |", "|---|---|"]
              for title, key in [("Identificador", "VulnerabilityID"), ("Pacote", "PkgName"), ("Versão instalada", "InstalledVersion"), ("Severidade", "Severity"), ("Versão corrigida", "FixedVersion")]:
                  lines.append(f"| {title} | {cell(finding.get(key) or 'Não informada')} |")
              url = finding.get("PrimaryURL") or ""
              if urlsplit(url).scheme == "https" and urlsplit(url).netloc:
                  lines += ["", f'<a href="{html.escape(url, quote=True)}">Advisory do achado</a>']
          else:
              lines += ["", "Achado selecionado ainda não produzido. Consulte o status dos scans e da preparação de relatórios."]

          passed = outcome("sign_verify") == "success"
          lines += ["", "## Integridade e procedência — Cosign", "",
                    "| Verificação | Resultado |", "|---|---|",
                    f"| Imagem legítima, identidade e atestação SBOM | {'🟢 Verificadas' if passed else labels.get(outcome('sign_verify'), '⚪ Indisponível') + ' — consultar logs'} |",
                    f"| Variante adulterada acessível e sem assinatura confiável | {'🟢 Rejeitada pelo motivo esperado' if passed else labels.get(outcome('sign_verify'), '⚪ Indisponível') + ' — consultar logs'} |",
                    f"| Código de retorno do teste negativo | {cell(read_text('cosign-tampered.exit-code'))} |", "",
                    f"**Imagem publicada:** `{cell(read_text('signed-image.txt'))}`", "",
                    f"**Variante adulterada:** `{cell(read_text('tampered-image.txt'))}`", "",
                    f"**Identidade confiável:** `{cell(read_text('trusted-identity.txt'))}`", "",
                    "Código diferente de zero sozinho não comprova rejeição por ausência de assinatura; o diagnóstico e os controles positivos também precisam passar."]

          lines += ["", "## Evidências e próximos passos", ""]
          artifact_url = os.environ.get("ARTIFACT_URL", "")
          if artifact_url and outcome("evidence") == "success":
              lines += [f"[Baixar pacote de evidências]({artifact_url})", ""]
          else:
              lines += ["Artifact indisponível. Consulte a etapa de upload e os logs da execução.", ""]
          lines += ["| Conteúdo | Arquivos no artifact |", "|---|---|",
                    "| Testes, usuário e política | `opa-tests.txt`, `opa-coverage.json`, `image-*.json`, `policy-*.json`, `run-*.txt` |",
                    "| Inventário e vulnerabilidades | `sbom-*.cdx.json`, `trivy-*.json`, `trivy-*.txt`, `selected-finding.json` |",
                    "| Apresentação | `vulnerability.md`, `trivy-report.html`, `trivy-before.png` |",
                    "| Assinatura e adulteração (Supply chain) | `cosign-*`, `signed-image.txt`, `tampered-image.txt`, `tampered-assertion.txt` |",
                    "| Rastreabilidade | `manifest.json`, locks, base por digest e `tool-versions.txt` |", "",
                    "Arquivos de etapas interrompidas podem estar ausentes ou incompletos. Os originais e checksums ficam no artifact; a retenção solicitada é de 90 dias."]
          failed = [title for step, title in controls if outcome(step) in ("failure", "cancelled")]
          if failed:
              lines += ["", "**Etapas a revisar:** " + "; ".join(failed) + ". Consulte os logs, corrija a causa e repita o workflow."]
          if notes:
              lines += ["", "**Relatórios incompletos:** " + " ".join(notes)]
          lines += ["", "## Execução detalhada por etapa", "",
                    "Cada etapa reúne sua definição no workflow e as saídas correspondentes. Trechos extensos têm limite de exibição; os registros completos capturados estão no artifact."]
          workflow_path = Path(os.environ["WORKFLOW_FILE"])
          source_lines = workflow_path.read_text().splitlines()
          stage_blocks = []
          current = None
          for source_line in source_lines:
              if source_line.startswith("      - name: "):
                  if current is not None:
                      stage_blocks.append(current)
                  current = [source_line]
              elif current is not None:
                  current.append(source_line)
          if current is not None:
              stage_blocks.append(current)
          output_map = {
              "cache": ["command-logs/01-cache.log"],
              "policy": ["command-logs/02-policy.log", "opa-tests.txt", "run-before.txt", "run-after.txt", "policy-before.json", "policy-after.json"],
              "sbom_before": ["sbom-before.cdx.json"],
              "sbom_after": ["sbom-after.cdx.json"],
              "trivy_before": ["trivy-before.txt", "trivy-before.json"],
              "trivy_after": ["trivy-after.txt", "trivy-after.json"],
              "reports": ["command-logs/03-reports.log", "vulnerability.md", "trivy-comparison.json", "screenshot.log"],
              "registry": ["command-logs/04-registry.log"],
              "publish": ["command-logs/05-publish.log", "push-after.txt", "signed-image.txt", "policy-published.json"],
              "sbom_published": ["sbom-published.cdx.json"],
              "sign_verify": ["command-logs/06-sign-verify.log", "cosign-sign.txt", "cosign-verify.json", "cosign-verify.stderr", "cosign-attest.txt", "cosign-sbom.json", "cosign-sbom.stderr", "tampered-assertion.txt", "cosign-tampered.stderr", "cosign-tampered.exit-code", "cosign-verify-after-attack.json"],
              "collect": ["command-logs/07-collect.log", "tool-versions.txt", "manifest.json"],
          }
          remaining_bytes = 350_000
          for number, block in enumerate(stage_blocks, 1):
              title = block[0].split("- name: ", 1)[1]
              if title == "Publicar Job Summary":
                  continue
              step_id = next((line.strip().split(": ", 1)[1] for line in block if line.startswith("        id: ")), "")
              action = next((line.strip() for line in block if line.startswith("        uses: ")), None)
              stage_status = labels.get(outcome(step_id), cell(outcome(step_id)))
              lines += ["", f"### {number}. {cell(title)}", "", f"**Status:** {stage_status}", ""]
              if action:
                  definition = [action]
                  copying = False
                  for line in block[1:]:
                      if line.startswith("        with:"):
                          copying = True
                          definition.append("with:")
                      elif copying and line.startswith("          "):
                          definition.append(line[8:])
                      elif copying:
                          break
                  command = "\n".join(definition)
                  lines += ["**Action e parâmetros:**", "", "<pre>", html.escape(command), "</pre>", "",
                            f"[Logs dos comandos internos desta Action]({run_url})", ""]
              else:
                  run_index = next((i for i, line in enumerate(block) if line.startswith("        run:")), None)
                  if run_index is None:
                      command = "Definição indisponível; consulte o workflow."
                  elif block[run_index].strip() == "run: |":
                      command_lines = []
                      for line in block[run_index + 1:]:
                          if line and not line.startswith("          "):
                              break
                          command_lines.append(line[10:] if line else "")
                      command = "\n".join(line for line in command_lines if not line.startswith(("exec > >(tee", "mkdir -p \"$RUNNER_TEMP/command-logs", "set -x")))
                  else:
                      command = block[run_index].split("run:", 1)[1].strip()
                  lines += ["**Comandos:**", "", "<pre>", html.escape(command[:16000]), "</pre>"]
              lines += ["", "**Saídas desta etapa:**", ""]
              found = False
              for name in output_map.get(step_id, []):
                  file = root / name
                  if not file.is_file():
                      continue
                  found = True
                  with file.open(errors="replace") as output:
                      excerpt = output.read(8001)
                  truncated = len(excerpt) > 8000
                  if name.startswith("command-logs/"):
                      excerpt = "\n".join(line for line in excerpt.splitlines() if not line.startswith("+"))
                  rendered = [f"*{cell(file.name)}*", "", "<pre>", html.escape(excerpt[:8000]), "</pre>", ""]
                  if truncated:
                      rendered += ["Trecho limitado; saída completa no artifact.", ""]
                  size = len("\n".join(rendered).encode("utf-8"))
                  if size > remaining_bytes:
                      lines += ["Limite de exibição das saídas atingido; consulte o artifact e os logs.", ""]
                      break
                  remaining_bytes -= size
                  lines += rendered
              if not found:
                  if step_id == "evidence" and artifact_url:
                      lines += [f"[Pacote de evidências gerado]({artifact_url})", ""]
                  elif outcome(step_id) == "skipped":
                      lines += ["Etapa não executada; não há saída produzida.", ""]
                  else:
                      lines += [f"[Consultar a saída nos logs desta etapa]({run_url})", ""]
          lines += ["", "Os parâmetros acima são a definição versionada; os valores resolvidos e os comandos realmente percorridos pelo shell estão nos registros capturados. Tokens são omitidos. Os logs do upload e deste próprio Summary ficam na execução do GitHub."]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("\n".join(lines))
